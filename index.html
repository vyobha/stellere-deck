
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Stellére — Pre-Seed Deck</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ─── Email gate ─── -->
<div id="gate">
  <div class="gate-card">
    <div class="brand">STELLÉRE</div>
    <div class="sub">Pre-Seed &middot; Confidential</div>
    <form id="gate-form" autocomplete="off">
      <input type="text" id="viewer-name" placeholder="Your name" required />
      <input type="email" id="viewer-email" placeholder="Your email" required />
      <button type="submit" id="gate-submit">View the deck</button>
      <div class="gate-error" id="gate-error"></div>
    </form>
    <div class="gate-note">By continuing, you'll get access to the deck.<br/>This link is for your use only — please don't forward it.</div>
  </div>
</div>

<!-- ─── Deck viewer ─── -->
<div id="viewer" class="hidden">
  <div class="viewer-header">
    <span>Stellére Aviation &middot; Pre-Seed</span>
    <span class="name-tag" id="viewer-tag"></span>
  </div>
  <div class="slide-stage">
    <button class="nav-arrow prev" id="btn-prev" aria-label="Previous slide">&#8249;</button>
    <div class="slide-frame">
      <img id="slide-img" src="" alt="Slide" />
      <div class="video-hotspot" id="video-hotspot" style="display:none;" title="Watch prototype hover test footage"></div>
      <div class="email-hotspot email-hotspot-arnav" id="email-hotspot-arnav" style="display:none;" title="Email Arnav"></div>
      <div class="email-hotspot email-hotspot-gavneesh" id="email-hotspot-gavneesh" style="display:none;" title="Email Gavneesh"></div>
    </div>
    <button class="nav-arrow next" id="btn-next" aria-label="Next slide">&#8250;</button>
  </div>
  <div class="bottom-bar">
    <span class="counter" id="counter">1 / 15</span>
    <div class="dots" id="dots"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
